name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: python -m pip install -r requirements-ember.txt
      - run: dotnet build tools/FeatureDump -c Release
      - run: python -m pytest -v
      - run: python training/release_experiment.py --synthetic --out build/synthetic-demo
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: synthetic-demo-report
          path: build/synthetic-demo
